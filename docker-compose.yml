version: "3.9"

services:
  tiktok-bot:
    build: .
    container_name: tiktok-bot
    restart: unless-stopped
    command: ["python", "bot.py"]
    # Env vars (BOT_TOKEN, MAX_FILE_SIZE_MB, TEMP_DIR) are injected by Coolify via its UI.
    # For local dev: rename .env.example → .env and uncomment the line below.
    # env_file: .env
    volumes:
      - tiktok_tmp:/tmp/tiktok
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tiktok_tmp:
